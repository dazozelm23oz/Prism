[package]
name = "prism"
version = "0.1.0"
description = "Native Linux/KDE desktop graphing calculator and computer algebra workspace"
authors = ["Prism Team"]
edition = "2021"

[lib]
name = "prism_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = "2"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
which = "7"
mathhook-core = "0.2.0"
extended_matrix = "0.9.9"
extended_matrix_float = "1.0.0"
rssn = "0.2.13"
thales = "0.4.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
